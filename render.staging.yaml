# Staging-only Render Blueprint for PAMASMMA.
# This is intentionally separate from the root production render.yaml.
# It adopts the existing staging services; it must never provision production
# databases, caches, workers, or duplicate services.

services:
  - type: web
    name: pamasmma-api-staging
    runtime: python
    plan: free
    region: frankfurt
    branch: hf-pamasmma-deployment-fix
    autoDeployTrigger: checksPass
    numInstances: 1
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready

  - type: web
    name: pamasmma-web-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: hf-pamasmma-deployment-fix
    autoDeployTrigger: checksPass
    numInstances: 1
    buildCommand: >-
      cd frontend &&
      npm install &&
      npm run build &&
      mkdir -p .next/standalone/.next &&
      cp -R .next/static .next/standalone/.next/static &&
      if [ -d public ]; then cp -R public .next/standalone/public; fi
    startCommand: cd frontend && HOSTNAME=0.0.0.0 node .next/standalone/server.js
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://pamasmma-api-staging.onrender.com/api/v1

previews:
  generation: off
