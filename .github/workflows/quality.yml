name: Code Quality

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Type check
        run: yarn tsc -b --noEmit 2>/dev/null || yarn build 2>/dev/null || true
      - name: Lint
        run: yarn lint || true
