name: PAMASMMA CI

on:
  push:
    branches: [main, develop, fix/production-hardening, feature/website-completion, hf-pamasmma-deployment-fix]
  pull_request:
    branches: [main]

concurrency:
  group: pamasmma-ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend — Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff==0.16.10
          ruff check app/ tests/ ../deploy_space.py
      - name: Type check (mypy)
        run: |
          pip install mypy types-redis
          mypy app/ --ignore-missing-imports --no-strict-optional
      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test_secret_key_64_chars_minimum_for_ci_pipeline_security_00000' }}
          PAMASMMA_BOOTSTRAP_TOKEN: ${{ secrets.PAMASMMA_BOOTSTRAP_TOKEN || 'test-bootstrap-token' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-test-dummy' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-dummy' }}
          APP_ENV: test
          PERSISTENCE_MODE: memory
          MODEL_PROVIDER: kernel
          EMBEDDING_PROVIDER: local
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          file: backend/coverage.xml

  durable-backend:
    name: Durable Backend — Postgres + Valkey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: pamasmma
          POSTGRES_USER: pamasmma
          POSTGRES_PASSWORD: pamasmma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pamasmma -d pamasmma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply Alembic migrations
        env:
          APP_ENV: test
          PERSISTENCE_MODE: postgres
          DATABASE_URL: postgresql+asyncpg://pamasmma:pamasmma@127.0.0.1:5432/pamasmma
          REDIS_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: test_secret_key_64_chars_minimum_for_durable_ci_00000
          PAMASMMA_BOOTSTRAP_TOKEN: test-bootstrap-token
          MODEL_PROVIDER: kernel
          EMBEDDING_PROVIDER: local
        run: alembic upgrade head
      - name: Run durable integration smoke test
        env:
          APP_ENV: test
          PERSISTENCE_MODE: postgres
          DATABASE_URL: postgresql+asyncpg://pamasmma:pamasmma@127.0.0.1:5432/pamasmma
          REDIS_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: test_secret_key_64_chars_minimum_for_durable_ci_00000
          PAMASMMA_BOOTSTRAP_TOKEN: test-bootstrap-token
          MODEL_PROVIDER: kernel
          EMBEDDING_PROVIDER: local
          RUN_DURABLE_TESTS: "1"
        run: pytest tests/test_durable_smoke.py -v

  frontend:
    name: Frontend — Type-check & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://pamasmma-api.onrender.com/api/v1
        run: npm run build

  staging-smoke:
    name: Staging API, CORS, frontend and auth smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/hf-pamasmma-deployment-fix'
    steps:
      - name: Check API liveness and readiness
        env:
          API_BASE: https://pamasmma-api-staging.onrender.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-max-time 150 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "$API_BASE/health" -o /tmp/health.json
          python - <<'PY'
          import json
          with open("/tmp/health.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("status") == "healthy", data
          assert data.get("persistence") == "memory", data
          assert data.get("intelligence") == "kernel", data
          print("API liveness healthy; staging is explicitly ephemeral/kernel mode.")
          PY

          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-max-time 150 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "$API_BASE/health/ready" -o /tmp/readiness.json
          python - <<'PY'
          import json
          with open("/tmp/readiness.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("status") == "ready", data
          print("API readiness endpoint returns ready.")
          PY

      - name: Verify frontend and API CORS contract
        env:
          API_BASE: https://pamasmma-api-staging.onrender.com
          WEB_ORIGIN: https://pamasmma-web-staging.onrender.com
          WEB_URL: https://pamasmma-web-staging.onrender.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 5 --retry-max-time 120 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "$WEB_URL/" -o /tmp/home.html
          grep -q '<html' /tmp/home.html

          curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -D /tmp/cors-headers -o /tmp/cors-body \
            -X OPTIONS "$API_BASE/api/v1/auth/totp/setup" \
            -H "Origin: $WEB_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,x-bootstrap-token"
          grep -Eiq '^access-control-allow-origin: https://pamasmma-web-staging\.onrender\.com\r?
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, durable-backend, frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hf-pamasmma-deployment-fix'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pamasmma-api:ci ./backend
      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://pamasmma-api-staging.onrender.com/api/v1 \
            -t pamasmma-web:ci \
            ./frontend
      - name: Build Hugging Face Space frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://pamasmma-api-staging.onrender.com/api/v1 \
            -f hf-space/Dockerfile \
            -t pamasmma-hf-space:ci \
            ./frontend
 /tmp/cors-headers
          echo "Frontend responds and API CORS preflight admits the exact staging origin."

      - name: Verify founder bootstrap endpoint rejects an invalid credential
        env:
          API_BASE: https://pamasmma-api-staging.onrender.com
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -o /tmp/auth-response.json -w '%{http_code}' \
            -X POST "$API_BASE/api/v1/auth/totp/setup" \
            -H 'Content-Type: application/json' \
            -H 'X-Bootstrap-Token: deliberately-invalid-ci-credential' \
            --data '{"user_id":"kelson-mwangi-cirvanna","username":"kelson@cirvanna.co"}')
          test "$code" = "401"
          echo "Founder bootstrap endpoint rejects an invalid token (HTTP 401)."

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, durable-backend, frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pamasmma-api:ci ./backend
      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://pamasmma-api-staging.onrender.com/api/v1 \
            -t pamasmma-web:ci \
            ./frontend
      - name: Build Hugging Face Space frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://pamasmma-api-staging.onrender.com/api/v1 \
            -f hf-space/Dockerfile \
            -t pamasmma-hf-space:ci \
            ./frontend
