name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      # better-sqlite3 compiles a native addon; these tools are pre-installed
      # on ubuntu-latest but making them explicit documents the requirement.
      - name: Install native build tools
        run: sudo apt-get install -y python3 make g++

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # tsc --build --noEmit is only valid in TS >=5.4; use yarn build (emits
      # to dist/) which also catches all type errors across the solution.
      - name: Build (type-check + emit)
        run: yarn build

      - name: Lint
        run: yarn lint
        continue-on-error: true

      - name: Run tests
        run: yarn test --ci --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
