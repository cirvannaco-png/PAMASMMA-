receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    limit_mib: 256
    check_interval: 1s

exporters:
  # Log traces to stdout in development — swap for a real backend in production
  # (Jaeger, Tempo, Datadog, etc.)
  debug:
    verbosity: basic

  # Uncomment and configure to forward to Jaeger:
  # otlp/jaeger:
  #   endpoint: jaeger:4317
  #   tls:
  #     insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
